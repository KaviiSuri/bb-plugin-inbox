<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PROTOTYPE · Inbox logic</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --accent: #3451d1; --accent-soft: #eef1fc; --ink: #1b1d22; --muted: #6b7080; --line: #e3e5ea; --bg: #f4f5f7; --card: #fff; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
  code, .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; }
  header { padding: 18px 32px 0; background: var(--card); border-bottom: 1px solid var(--line); }
  header .tag { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  header h1 { margin: 2px 0 4px; font-size: 21px; font-weight: 650; }
  header p { margin: 0 0 14px; color: #3c404a; max-width: 900px; }
  .tabs { display: flex; gap: 2px; flex-wrap: wrap; }
  .tabs button { border: 0; background: none; font: inherit; font-size: 14px; padding: 9px 14px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; }
  .tabs button.on { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
  .tabs button.free { margin-left: auto; }
  .stage { display: grid; grid-template-columns: 330px minmax(0, 680px); gap: 40px; padding: 28px 32px; align-items: start; }

  /* The sidebar mock: what the user would actually see. */
  .sbwrap .cap { font-size: 12px; color: var(--muted); margin: 0 0 6px 2px; }
  .sb { background: #fbfbfc; border: 1px solid var(--line); border-radius: 12px; padding: 10px; min-height: 420px; font-size: 13px; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .sb-tabs { display: flex; background: #eceef2; border-radius: 8px; padding: 3px; margin-bottom: 10px; }
  .sb-tabs span { flex: 1; text-align: center; padding: 4px; border-radius: 6px; color: var(--muted); font-size: 13px; }
  .sb-tabs span.on { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .run { display: flex; gap: 8px; align-items: baseline; padding: 7px 9px; border-radius: 8px; color: #3c404a; border: 1px solid transparent; }
  .run b { font-variant-numeric: tabular-nums; }
  .run .names { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tier-h { margin: 12px 4px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
  .row { padding: 8px 9px; border-radius: 8px; border: 1px solid transparent; margin-bottom: 2px; }
  .row .t { font-weight: 600; font-size: 14px; }
  .row .r { color: #3c404a; }
  .row .ev { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .row .ev .mono { font-size: 11px; color: #3c404a; }
  .row .back { display: inline-block; font-size: 11px; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .05em; margin-right: 4px; }
  .row .acts { display: flex; gap: 5px; margin-top: 6px; }
  .tier1 .t::before { content: "● "; color: var(--accent); }
  .zero { color: var(--muted); padding: 18px 9px; text-align: center; }
  .seenband { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 4px; opacity: .8; }
  .left { margin-top: 12px; padding: 7px 9px; border-radius: 8px; color: #3c404a; }
  .hl { background: var(--accent-soft); border-color: var(--accent) !important; }
  .moved { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin-left: 6px; }

  /* The story. */
  .story .q { font-size: 24px; line-height: 1.3; font-weight: 650; margin: 0 0 12px; }
  .story .setup { font-size: 16px; color: #3c404a; margin: 0 0 22px; }
  .counter { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 10px; }
  .lines { display: grid; grid-template-columns: 110px 1fr; gap: 14px 18px; font-size: 19px; line-height: 1.4; margin-bottom: 18px; }
  .lines .k { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); padding-top: 5px; }
  .lines .rule { color: var(--accent); font-weight: 600; }
  .modelsaid { font-size: 13px; color: var(--muted); margin: -6px 0 18px; padding-left: 128px; }
  .other { border: 1px dashed var(--accent); border-radius: 10px; padding: 12px 14px; margin-bottom: 20px; }
  .other p { margin: 8px 0 0; font-size: 15px; }
  .nav { display: flex; gap: 12px; align-items: center; }
  .btn { font: inherit; font-size: 14px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); cursor: pointer; color: var(--ink); }
  .btn.small { font-size: 12px; padding: 3px 8px; border-radius: 6px; }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.big { font-size: 16px; padding: 10px 22px; }
  .link { background: none; border: 0; font: inherit; font-size: 14px; color: var(--muted); cursor: pointer; padding: 0; }
  .link:hover { color: var(--ink); }
  .end { margin-top: 26px; padding: 16px 18px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  .end h3 { margin: 0 0 4px; font-size: 18px; }
  .end p { margin: 0 0 12px; color: #3c404a; }

  /* Free play. */
  .fp h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 0 6px; font-weight: 600; }
  .fp h2:first-child { margin-top: 0; }
  .fp .btns { display: flex; flex-wrap: wrap; gap: 6px; }
  .fp .pick { display: flex; flex-direction: column; gap: 3px; }
  .fp .pick button { text-align: left; font: inherit; border: 1px solid transparent; background: none; padding: 5px 8px; border-radius: 6px; cursor: pointer; }
  .fp .pick button.on { border-color: var(--accent); background: var(--accent-soft); }
  .fp .pick .s { color: var(--muted); font-size: 13px; }
  .fp .said { font-size: 16px; padding: 10px 12px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 14px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; margin: 2px 0 8px; }
  .seg button { border: 0; background: var(--card); padding: 5px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--accent); color: #fff; }
  .seglabel { font-size: 13px; color: #3c404a; }

  /* Details, off by default. */
  .details { padding: 0 32px 40px; }
  .details > button { margin-bottom: 12px; }
  .dgrid { display: grid; grid-template-columns: minmax(280px, 1fr) minmax(280px, 1fr); gap: 16px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 13px; }
  .panel h3 { margin: 0 0 8px; font-size: 14px; }
  .thread { padding: 5px 0; }
  .thread .tt { font-weight: 600; }
  .thread .facts div { color: #3c404a; }
  .thread .facts code { color: var(--muted); font-size: 11px; }
  .children { margin-left: 14px; border-left: 1px solid var(--line); padding-left: 8px; }
  .entry { padding: 6px 0; border-bottom: 1px solid var(--line); }
  .entry:last-child { border-bottom: 0; }
  .entry .m { color: var(--muted); font-size: 12px; }
  .events div { padding: 1px 0; }
  .events .tm { color: var(--muted); font-variant-numeric: tabular-nums; margin-right: 6px; }

  /* Phone, and narrow bb chat embeds. */
  @media (max-width: 800px) {
    body { font-size: 15px; }
    header { padding: 14px 16px 0; }
    header h1 { font-size: 19px; }
    header p { font-size: 14px; margin-bottom: 10px; }
    .tabs { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
    .tabs::-webkit-scrollbar { display: none; }
    .tabs button { flex: none; white-space: nowrap; min-height: 40px; padding: 8px 12px; }
    .tabs button.free { margin-left: 0; }
    .stage { grid-template-columns: minmax(0, 1fr); gap: 18px; padding: 16px; }
    .sb { min-height: 0; }
    .story .q { font-size: 20px; }
    .lines { grid-template-columns: minmax(0, 1fr); gap: 2px; font-size: 17px; }
    .lines .k { padding-top: 10px; }
    .modelsaid { padding-left: 0; margin-top: 0; }
    .other { padding: 10px; }
    .nav { flex-direction: column; align-items: stretch; gap: 8px; }
    .btn, .btn.big { width: 100%; min-height: 44px; }
    .link { min-height: 40px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); width: 100%; }
    .end .btn + .btn { margin-top: 8px; }
    .row .acts .btn.small, .fp .btns .btn { width: auto; min-height: 40px; }
    .fp .pick button { min-height: 40px; }
    .details { padding: 0 16px 32px; }
    .dgrid { grid-template-columns: minmax(0, 1fr); }
  }
</style>
</head>
<body>
<header>
  <div class="tag">Prototype · throwaway · issue #4</div>
  <h1>How should the inbox behave?</h1>
  <p>Each tab is a short story about your agents. Press <b>Next</b> and watch the inbox: it's what the sidebar's Inbox tab would show you. Next to it (or below it, on a phone) it says what happened and why.</p>
  <div class="tabs" id="tabs"></div>
</header>
<div class="stage">
  <div class="sbwrap"><p class="cap">Your sidebar, Inbox tab</p><div id="sidebar"></div></div>
  <div id="right"></div>
</div>
<div class="details" id="details"></div>
<!-- ======================================================================
     THE MODEL. Pure, no DOM. Liftable into the real plugin.
     deriveInbox(threads, verifications, settings, now) -> view
     reduce(state, action) -> state
     ====================================================================== -->
<script>
const InboxModel = (() => {
  const TIER_NAMES = { 1: 'Blocked on you', 2: 'Broken', 3: 'Verify', 4: 'FYI' };
  // PluginSidebarThread.status values that mean "still working".
  const RUNNING_STATUSES = new Set(['active', 'starting', 'stopping', 'pending']);
  const INTERACTION_LABELS = {
    approval: 'your permission',
    user_question: 'an answer to its question',
    plan: 'a plan review',
  };

  // Who a thread talks to. Top-level threads always talk to you.
  // Declared at spawn wins; inference is the fallback.
  function audienceOf(t) {
    if (!t.parentThreadId) return { audience: 'human', why: 'top-level thread' };
    if (t.declaredAudience) return { audience: t.declaredAudience, why: 'set when it was spawned' };
    if (t.hasPendingInteraction && t.interactionKind === 'user_question')
      return { audience: 'human', why: 'guessed: it asked you a question' };
    if (t.usedGrillingSkill) return { audience: 'human', why: 'guessed: it used the grilling skill' };
    if (t.turnEnd === 'question') return { audience: 'human', why: 'guessed: it ended a turn with a question' };
    return { audience: 'parent', why: 'guessed: nothing it did was aimed at you' };
  }

  // The thread whose inbox item this thread shows up on.
  function itemOwnerId(threads, t, settings) {
    let cur = t;
    while (cur.parentThreadId && threads[cur.parentThreadId]) {
      if (settings.childRouting === 'own-item' && audienceOf(cur).audience === 'human') return cur.id;
      cur = threads[cur.parentThreadId];
    }
    return cur.id;
  }

  function lastRecord(verifications, threadId, kind) {
    for (let i = verifications.length - 1; i >= 0; i--) {
      const v = verifications[i];
      if (v.threadId === threadId && v.kind === kind) return v;
    }
    return null;
  }

  // One thread's own condition, from deterministic signals only.
  function ownState(t, now, settings) {
    if (t.hasPendingInteraction)
      return { kind: 'needs', tier: 1, reason: `Waiting for ${INTERACTION_LABELS[t.interactionKind] || 'you'}` };
    if (t.status === 'error') return { kind: 'needs', tier: 2, reason: `Stopped with an error: ${t.error}` };
    if (RUNNING_STATUSES.has(t.status)) return { kind: 'running' };
    if (t.pr && t.pr.checks === 'failing') return { kind: 'needs', tier: 2, reason: `PR #${t.pr.number} checks are failing` };
    // The one model-classified signal: did the turn end with a question or a report?
    if (t.turnEnd === 'question') return { kind: 'needs', tier: 1, reason: 'Ended its turn with a question for you' };
    // Grace only applies to a plain finish; needing you skips it.
    if (t.stoppedAt != null && now - t.stoppedAt < settings.graceMs) return { kind: 'settling' };
    if (t.turnEnd === 'report') return { kind: 'done' };
    return { kind: 'quiet' };
  }

  function deriveInbox(threads, verifications, settings, now) {
    const all = Object.values(threads);
    const running = [];
    const ownerOf = {};
    const folded = {};
    for (const t of all) {
      const s = ownState(t, now, settings);
      if (s.kind === 'running' || s.kind === 'settling')
        running.push({ threadId: t.id, title: t.title, settling: s.kind === 'settling' });
      const o = itemOwnerId(threads, t, settings);
      ownerOf[t.id] = o;
      if (o !== t.id) (folded[o] = folded[o] || []).push(t);
    }

    const items = [], seen = [], cleared = [];
    for (const owner of all) {
      if (ownerOf[owner.id] !== owner.id) continue;
      const own = ownState(owner, now, settings);
      const v = lastRecord(verifications, owner.id, 'verified');
      const s = lastRecord(verifications, owner.id, 'seen');

      const reasons = [], notes = [], escalations = [], childSummaries = [];
      let attentionAt = owner.attentionAt;
      if (own.kind === 'needs') reasons.push(own.reason);
      for (const c of folded[owner.id] || []) {
        const cs = ownState(c, now, settings);
        const aud = audienceOf(c).audience;
        const name = `“${c.title}”`;
        if (cs.kind === 'needs' && cs.tier === 1) {
          // A real UI prompt (permission, question form) needs a human whatever the audience.
          if (c.hasPendingInteraction || aud === 'human') {
            escalations.push(1); reasons.push(`Child ${name}: ${cs.reason.toLowerCase()}`);
            attentionAt = Math.max(attentionAt, c.attentionAt);
          } else notes.push(`Child ${name} asked its parent a question. The parent answers it.`);
        } else if (cs.kind === 'needs' && cs.tier === 2) {
          if (aud === 'human') {
            escalations.push(2); reasons.push(`Child ${name}: ${cs.reason.toLowerCase()}`);
            attentionAt = Math.max(attentionAt, c.attentionAt);
          } else notes.push(`Child ${name} hit a problem. Its parent is expected to handle it.`);
        } else if (cs.kind === 'running' || cs.kind === 'settling') {
          notes.push(`Child ${name} is still running.`);
        }
        if (c.turnEnd === 'report' && c.workSeq > 0 && cs.kind !== 'running') {
          const isNew = !v || c.workSeq > (v.childSeqs[c.id] || 0);
          childSummaries.push({ threadId: c.id, title: c.title, summary: c.reportSummary, seq: c.workSeq, isNew });
        }
      }

      const needTiers = [...(own.kind === 'needs' ? [own.tier] : []), ...escalations];
      const newWork = !v || owner.workSeq > v.workSeq || childSummaries.some(c => c.isNew);
      const scoped = settings.comeBack === 'scoped' && !!v;
      const commits = scoped ? owner.commits.filter(c => c.seq > v.workSeq) : owner.commits;
      const kids = scoped ? childSummaries.filter(c => c.isNew) : childSummaries;
      const evidence = {
        commits,
        hiddenCommits: owner.commits.length - commits.length,
        tests: commits.length ? owner.tests : null,
        pr: owner.pr,
        childSummaries: kids,
        hiddenChildSummaries: childSummaries.length - kids.length,
      };
      const hasEvidence = commits.length > 0 || kids.length > 0 || (owner.pr && owner.pr.checks === 'passing' && newWork);

      let tier, band = 'inbox';
      if (needTiers.length) {
        tier = Math.min(...needTiers);
      } else if (own.kind === 'running' || own.kind === 'settling') {
        continue;
      } else if (own.kind === 'done' || (own.kind === 'quiet' && childSummaries.length)) {
        if (!newWork) { cleared.push({ threadId: owner.id, title: owner.title, verifiedAt: v.at }); continue; }
        const seenSinceWork = s && (!v || s.at > v.at) && s.workSeq === owner.workSeq &&
          childSummaries.every(c => c.seq <= (s.childSeqs[c.threadId] || 0));
        if (seenSinceWork) band = 'seen';
        tier = commits.length || (owner.pr && newWork) ? 3 : 4;
        if (tier === 3) reasons.push(v ? 'Finished more work since you verified it' : 'Finished, with changes to check');
        else if (kids.length) reasons.push(`Summary of ${kids.length} child thread${kids.length > 1 ? 's' : ''}`);
        else reasons.push(owner.commits.length ? 'Reported back, but changed nothing new' : 'Reported back, nothing changed');
      } else continue;

      const item = {
        threadId: owner.id, title: owner.title, tier, tierName: TIER_NAMES[tier],
        reasons, notes, evidence, hasEvidence, ownerRunning: own.kind === 'running' || own.kind === 'settling',
        back: v && newWork ? { verifiedAt: v.at, baseSha: v.baseSha, scoped } : null,
        attentionAt, band,
      };
      (band === 'seen' ? seen : items).push(item);
    }
    const byTier = (a, b) => a.tier - b.tier || b.attentionAt - a.attentionAt;
    items.sort(byTier); seen.sort(byTier);
    return { items, seen, cleared, running, ownerOf };
  }

  // Why a sign-off is refused, or null if it's allowed.
  function whyCannotClear(view, threads, threadId, kind, settings) {
    const t = threads[threadId];
    if (kind === 'seen' && settings.clearing !== 'verify-or-seen')
      return '“Mark seen” is switched off. Under “verify only”, the only way out of the inbox is a sign-off.';
    const item = view.items.concat(view.seen).find(i => i.threadId === threadId);
    if (!item) {
      if (view.ownerOf[threadId] !== threadId)
        return `“${t.title}” has no item of its own. It folds into “${threads[view.ownerOf[threadId]].title}”, so sign off there.`;
      const r = view.running.find(r => r.threadId === threadId);
      if (r && r.settling) return `“${t.title}” only just finished. It stays in the running count for a 2-second grace, so a quick follow-up doesn't make it flicker in and out.`;
      if (r) return `“${t.title}” is still running. You can only sign off on finished work.`;
      if (view.cleared.find(c => c.threadId === threadId)) return `“${t.title}” is already verified, and it hasn't done anything since.`;
      return `“${t.title}” isn't in the inbox.`;
    }
    if (item.tier === 1) return `“${t.title}” is waiting for you. Answer it first; signing off doesn't answer a question.`;
    if (item.tier === 2) return `“${t.title}” is broken. You can't sign off on a failure; restart or fix it.`;
    if (kind === 'verified' && !item.hasEvidence)
      return `There's nothing to verify on “${t.title}”: no changes, tests, PR or child summaries${item.back && item.back.scoped ? ' since your last sign-off' : ''}.`;
    if (kind === 'seen' && item.band === 'seen') return `“${t.title}” is already marked seen.`;
    return null;
  }

  // ---------- events ----------
  function sha(id, seq) {
    let h = 2166136261;
    for (const ch of id + ':' + seq) h = Math.imul(h ^ ch.charCodeAt(0), 16777619) >>> 0;
    return h.toString(16).padStart(8, '0').slice(0, 7);
  }
  const FILES = ['app/settings.tsx', 'server/auth.ts', 'lib/theme.ts', 'app/login.tsx', 'tests/auth.test.ts', 'docs/README.md', 'lib/billing.ts'];

  function initialState(settings) {
    return {
      now: 9 * 3600 * 1000,
      nextId: 1,
      threads: {},
      verifications: [],
      settings: { childRouting: 'own-item', clearing: 'verify-only', comeBack: 'scoped', graceMs: 2000, ...settings },
      log: [],
      lastRefusal: null,
    };
  }

  function newThread(state, title, parentThreadId, declaredAudience) {
    const id = 't' + state.nextId++;
    state.threads[id] = {
      id, title, parentThreadId: parentThreadId || null, declaredAudience: declaredAudience || null,
      status: 'active', hasPendingInteraction: false, interactionKind: null, turnEnd: null,
      usedGrillingSkill: false, commits: [], tests: null, pr: null, error: null, workSeq: 0,
      reportSummary: null, stoppedAt: null, attentionAt: state.now,
    };
    return id;
  }

  function reduce(prev, action) {
    const state = structuredClone(prev);
    state.lastRefusal = null;
    if (action.type !== 'settingChanged') state.now += action.type === 'timePassed' ? action.ms : 1000;
    const t = action.threadId ? state.threads[action.threadId] : null;
    const log = (text, refused) => state.log.push({ at: state.now, text, refused: !!refused });
    const refuse = reason => { state.lastRefusal = { action, reason }; log('Refused: ' + reason, true); return state; };
    const stop = () => { t.status = 'idle'; t.stoppedAt = state.now; t.attentionAt = state.now; t.workSeq += 1; };
    const isRunning = () => RUNNING_STATUSES.has(t.status) && !t.hasPendingInteraction;

    switch (action.type) {
      case 'threadStarted': {
        const id = newThread(state, action.title || `Task ${state.nextId}`);
        log(`You started “${state.threads[id].title}”. It's running.`);
        return state;
      }
      case 'childSpawned': {
        const p = state.threads[action.parentId];
        const id = newThread(state, action.title || `Child of ${p.title}`, p.id, action.audience);
        const aud = action.audience === 'human' ? 'talks to you' : action.audience === 'parent' ? 'works for its parent' : 'audience not set';
        log(`“${p.title}” spawned a child, “${state.threads[id].title}” (${aud}).`);
        return state;
      }
      case 'workResumed':
        if (isRunning()) return refuse(`“${t.title}” is already running.`);
        Object.assign(t, { status: 'active', hasPendingInteraction: false, interactionKind: null, turnEnd: null, error: null, stoppedAt: null });
        if (t.pr) t.pr.checks = 'pending';
        log(`“${t.title}” started working again.`);
        return state;
      case 'interactionRequested':
        if (t.hasPendingInteraction) return refuse(`“${t.title}” is already waiting for you.`);
        Object.assign(t, { status: 'active', hasPendingInteraction: true, interactionKind: action.kind, turnEnd: null, error: null, attentionAt: state.now });
        if (action.kind === 'user_question' && t.parentThreadId && !t.declaredAudience) t.usedGrillingSkill = t.usedGrillingSkill || false;
        log(`“${t.title}” paused and is waiting for ${INTERACTION_LABELS[action.kind]}.`);
        return state;
      case 'interactionAnswered':
        if (!t.hasPendingInteraction && t.turnEnd !== 'question') return refuse(`“${t.title}” isn't waiting for an answer.`);
        Object.assign(t, { hasPendingInteraction: false, interactionKind: null, status: 'active', turnEnd: null, stoppedAt: null });
        log(`You answered “${t.title}”. It carries on.`);
        return state;
      case 'turnEndedWithQuestion':
        if (!isRunning()) return refuse(`“${t.title}” isn't running, so it has no turn to end.`);
        stop(); t.turnEnd = 'question';
        log(`“${t.title}” finished its turn with a question (the cheap model read it as a question).`);
        return state;
      case 'turnEndedWithReport': {
        if (!isRunning()) return refuse(`“${t.title}” isn't running, so it has no turn to end.`);
        stop(); t.turnEnd = 'report';
        t.reportSummary = action.summary || (action.withDiff ? 'Made the change and ran the tests.' : 'Looked into it and wrote up what it found.');
        if (action.withDiff) {
          const seq = t.workSeq, n = 1 + (seq + t.id.length) % 3;
          const files = Array.from({ length: n }, (_, i) => FILES[(seq * 2 + i + t.id.charCodeAt(1)) % FILES.length]);
          t.commits.push({ seq, sha: sha(t.id, seq), files, insertions: 12 * seq + 8 * n, deletions: 3 * n, summary: action.commitSummary || `Change ${t.commits.length + 1}` });
          t.tests = { passed: 10 + 4 * t.commits.length, failed: 0, stub: true };
        }
        log(`“${t.title}” finished its turn with a report${action.withDiff ? ' and a diff' : ', no diff'}.`);
        return state;
      }
      case 'errored':
        Object.assign(t, { status: 'error', hasPendingInteraction: false, error: action.error || 'the provider crashed', stoppedAt: state.now, attentionAt: state.now });
        log(`“${t.title}” hit an error.`);
        return state;
      case 'usedGrillingSkill':
        t.usedGrillingSkill = true;
        log(`“${t.title}” loaded the grilling skill.`);
        return state;
      case 'prChecks':
        if (!t.commits.length) return refuse(`“${t.title}” has no changes, so there's no PR to check.`);
        if (!t.pr) t.pr = { number: 40 + state.nextId + t.commits.length, checks: 'pending' };
        t.pr.checks = action.result;
        if (action.result === 'failing') t.attentionAt = state.now;
        log(`PR #${t.pr.number} for “${t.title}”: checks ${action.result === 'failing' ? 'failed' : 'passed'}.`);
        return state;
      case 'timePassed':
        log(`${action.ms / 1000} seconds passed.`);
        return state;
      case 'settingChanged':
        state.settings[action.key] = action.value;
        log(`Setting changed: ${SETTING_LABELS[action.key].title} → ${SETTING_LABELS[action.key].options[action.value]}.`);
        return state;
      case 'verified':
      case 'markedSeen': {
        const kind = action.type === 'verified' ? 'verified' : 'seen';
        const view = deriveInbox(state.threads, state.verifications, state.settings, state.now);
        const why = whyCannotClear(view, state.threads, t.id, kind, state.settings);
        if (why) return refuse(why);
        const item = view.items.concat(view.seen).find(i => i.threadId === t.id);
        const childSeqs = {};
        for (const c of Object.values(state.threads)) if (view.ownerOf[c.id] === t.id && c.id !== t.id) childSeqs[c.id] = c.workSeq;
        const head = t.commits[t.commits.length - 1];
        state.verifications.push({
          id: 'v' + (state.verifications.length + 1), threadId: t.id, kind, at: state.now,
          by: 'this bb client', // no user identity reaches a plugin
          baseSha: head ? head.sha : null, workSeq: t.workSeq, childSeqs,
          evidence: structuredClone(item.evidence), scope: item.back ? (item.back.scoped ? 'only what changed since last sign-off' : 'everything') : 'everything',
        });
        log(kind === 'verified' ? `You verified “${t.title}”.` : `You marked “${t.title}” as seen. It is not verified.`);
        return state;
      }
    }
    return state;
  }

  const SETTING_LABELS = {
    childRouting: { title: 'A child that talks to you', options: { 'own-item': 'gets its own item', 'on-parent': 'shows on its parent’s item' } },
    clearing: { title: 'Clearing an item', options: { 'verify-only': 'verify only', 'verify-or-seen': 'verify, or mark seen' } },
    comeBack: { title: 'A verified thread that does more work comes back', options: { scoped: 'showing only what’s new', whole: 'showing everything' } },
  };

  return { deriveInbox, reduce, initialState, whyCannotClear, audienceOf, ownState, TIER_NAMES, SETTING_LABELS, RUNNING_STATUSES, INTERACTION_LABELS };
})();
</script>

const FREE = WALKS.length;
let ui = { tab: 0, step: 0, trying: false, details: false, sel: 't1' };
let state, base, prevView = null;

function startTab(i) {
  ui = { ...ui, tab: i, step: 0, trying: false, sel: 't1' };
  state = base = i === FREE ? FREE_SEED() : WALKS[i].start();
  prevView = null;
  render();
}
function goTo(n) {
  const w = WALKS[ui.tab];
  let s = w.start();
  for (let k = 0; k < n - 1; k++) s = apply(s, w.steps[k].actions);
  prevView = n > 0 ? view(s) : null;
  if (n > 0) s = apply(s, w.steps[n - 1].actions);
  state = base = s; ui.step = n; ui.trying = false;
  render();
}
function toggleOther() {
  const other = WALKS[ui.tab].steps[ui.step - 1].other;
  prevView = view(state);
  state = ui.trying ? base : apply(base, other.actions);
  ui.trying = !ui.trying;
  render();
}
function freeDispatch(a) { prevView = view(state); state = base = apply(state, a); render(); }

// ---------- the sidebar mock ----------
const sig = i => JSON.stringify({ tier: i.tier, band: i.band, reasons: i.reasons, ev: i.evidence, back: i.back });

function evidenceLine(item) {
  const e = item.evidence, out = [];
  if (e.commits.length) out.push(e.commits.map(c => `<span class="mono">${c.sha}</span> ${esc(c.summary)}`).join('<br>'));
  if (e.hiddenCommits) out.push(`${e.hiddenCommits} change${e.hiddenCommits > 1 ? 's' : ''} you already checked, hidden`);
  const bits = [];
  if (e.tests) bits.push(`tests: ${e.tests.passed} passed`);
  if (e.pr) bits.push(`PR #${e.pr.number}: checks ${e.pr.checks}`);
  if (bits.length) out.push(bits.join(' · '));
  for (const c of e.childSummaries) out.push(`${esc(c.title)}: “${esc(c.summary)}”`);
  return out.length ? `<div class="ev">${out.join('<br>')}</div>` : '';
}

function rowHtml(item, pv, interactive) {
  const was = pv && pv.items.concat(pv.seen).find(i => i.threadId === item.threadId);
  const tag = !pv ? '' : !was ? 'new' : (was.tier !== item.tier || was.band !== item.band) ? 'moved' : sig(was) !== sig(item) ? 'changed' : '';
  let acts = '';
  if (interactive) {
    if (item.tier >= 3) acts += `<button class="btn small primary" data-do='${esc(JSON.stringify({ type: 'verified', threadId: item.threadId }))}'>Verify</button>`;
    if (item.tier >= 3 && item.band !== 'seen' && state.settings.clearing === 'verify-or-seen') acts += `<button class="btn small" data-do='${esc(JSON.stringify({ type: 'markedSeen', threadId: item.threadId }))}'>Mark seen</button>`;
  }
  return `<div class="row tier${item.tier} ${tag ? 'hl' : ''}">
    <div class="t">${esc(item.title)}${tag ? `<span class="moved">${tag}</span>` : ''}</div>
    <div class="r">${item.back ? '<span class="back">Back</span>' : ''}${esc(item.reasons.join('. '))}</div>
    ${item.tier >= 3 ? evidenceLine(item) : ''}
    ${acts ? `<div class="acts">${acts}</div>` : ''}</div>`;
}

function renderSidebar(v, pv, interactive) {
  // Highlight the running line only when no item moved, so the eye lands on one place.
  const itemMoved = pv && (v.items.concat(v.seen).some(i => { const w = pv.items.concat(pv.seen).find(p => p.threadId === i.threadId); return !w || sig(w) !== sig(i); })
    || pv.items.concat(pv.seen).some(p => !v.items.concat(v.seen).find(i => i.threadId === p.threadId)));
  const n = v.running.length, changed = pv && pv.running.length !== n && !itemMoved;
  let h = `<div class="sb"><div class="sb-tabs"><span>Threads</span><span class="on">Inbox${v.items.length ? ` · ${v.items.length}` : ''}</span></div>
    <div class="run ${changed ? 'hl' : ''}"><b>Running ${n}</b>${changed ? `<span class="moved">was ${pv.running.length}</span>` : ''}<span class="names">${v.running.map(r => esc(r.title)).join(', ')}</span></div>`;
  if (!v.items.length) h += '<div class="zero">Nothing needs you.</div>';
  for (const tier of [1, 2, 3, 4]) {
    const its = v.items.filter(i => i.tier === tier);
    if (its.length) h += `<div class="tier-h">${M.TIER_NAMES[tier]}</div>` + its.map(i => rowHtml(i, pv, interactive)).join('');
  }
  if (v.seen.length) h += `<div class="seenband"><div class="tier-h">Seen, not verified</div>${v.seen.map(i => rowHtml(i, pv, interactive)).join('')}</div>`;
  if (pv) {
    const gone = pv.items.concat(pv.seen).filter(p => !v.items.concat(v.seen).find(i => i.threadId === p.threadId));
    for (const g of gone) {
      const why = v.cleared.find(c => c.threadId === g.threadId) ? 'verified' : v.running.find(r => r.threadId === g.threadId) ? 'running again' : v.ownerOf[g.threadId] !== g.threadId ? 'moved onto its parent' : 'nothing needs you';
      h += `<div class="left hl">✓ <b>${esc(g.title)}</b> left the inbox (${why})</div>`;
    }
  }
  document.getElementById('sidebar').innerHTML = h + '</div>';
  document.querySelectorAll('#sidebar [data-do]').forEach(b => b.onclick = () => freeDispatch(JSON.parse(b.dataset.do)));
}

// ---------- the story ----------
function renderStory() {
  const w = WALKS[ui.tab], n = w.steps.length;
  let h = `<div class="story"><div class="q">${esc(w.question)}</div>`;
  if (ui.step === 0) {
    h += `<p class="setup">${esc(w.setup)}</p><div class="nav"><button class="btn primary big" data-next>Start</button></div>`;
  } else {
    const s = w.steps[ui.step - 1];
    h += `<div class="counter">Step ${ui.step} of ${n}</div>
      <div class="lines"><div class="k">The agent</div><div>${esc(s.agent)}</div>
      <div class="k">The inbox</div><div>${esc(s.inbox)}</div>
      <div class="k">The rule</div><div class="rule">${esc(s.rule)}</div></div>`;
    if (base.lastRefusal && !ui.trying) h += `<div class="modelsaid">The model’s reason: “${esc(base.lastRefusal.reason)}”</div>`;
    if (s.other) h += `<div class="other"><button class="btn ${ui.trying ? 'primary' : ''}" data-other>${ui.trying ? '↩ Put it back' : esc(s.other.label)}</button>${ui.trying ? `<p>${esc(s.other.line)}</p>` : ''}</div>`;
    h += `<div class="nav">${ui.step < n ? '<button class="btn primary big" data-next>Next</button>' : ''}
      <button class="link" data-prev>← Back</button><button class="link" data-restart>Start over</button></div>`;
    if (ui.step === n) h += `<div class="end"><h3>Does this feel right?</h3><p>${esc(w.end)}</p>
      <button class="btn" data-restart>Start over</button> <button class="btn primary" data-tab="${ui.tab + 1}">${ui.tab + 1 < FREE ? 'Next story →' : 'Free play →'}</button></div>`;
  }
  const el = document.getElementById('right');
  el.innerHTML = h + '</div>';
  const on = (sel, fn) => el.querySelectorAll(sel).forEach(b => b.onclick = fn);
  on('[data-next]', () => goTo(ui.step + 1));
  on('[data-prev]', () => goTo(ui.step - 1));
  on('[data-restart]', () => goTo(0));
  on('[data-other]', toggleOther);
  on('[data-tab]', e => startTab(+e.currentTarget.dataset.tab));
}

// ---------- free play ----------
function plainStatus(t) {
  const s = M.ownState(t, state.now, state.settings);
  if (t.hasPendingInteraction) return `waiting for ${M.INTERACTION_LABELS[t.interactionKind]}`;
  if (t.status === 'error') return 'hit an error';
  if (s.kind === 'running') return 'working';
  if (s.kind === 'settling') return 'just finished';
  return t.turnEnd === 'question' ? 'finished with a question' : 'finished';
}

function renderFree() {
  const t = state.threads[ui.sel];
  const B = (label, a) => `<button class="btn" data-do='${esc(JSON.stringify(a))}'>${esc(label)}</button>`;
  const last = state.log[state.log.length - 1];
  let h = `<div class="fp"><div class="said">${esc(last.text)}</div>
    <h2>Pick an agent</h2><div class="pick">${Object.values(state.threads).map(x =>
      `<button class="${x.id === ui.sel ? 'on' : ''}" data-sel="${x.id}">${x.parentThreadId ? '↳ ' : ''}${esc(x.title)} <span class="s">${esc(plainStatus(x))}</span></button>`).join('')}</div>`;
  if (t) {
    const id = t.id;
    h += `<h2>${esc(t.title)}…</h2><div class="btns">
      ${B('asks your permission', { type: 'interactionRequested', threadId: id, kind: 'approval' })}
      ${B('asks you a question', { type: 'interactionRequested', threadId: id, kind: 'user_question' })}
      ${B('sends a plan to review', { type: 'interactionRequested', threadId: id, kind: 'plan' })}
      ${B('finishes with a change', { type: 'turnEndedWithReport', threadId: id, withDiff: true })}
      ${B('finishes with a report only', { type: 'turnEndedWithReport', threadId: id, withDiff: false })}
      ${B('finishes with a question', { type: 'turnEndedWithQuestion', threadId: id })}
      ${B('hits an error', { type: 'errored', threadId: id })}
      ${B('starts working again', { type: 'workResumed', threadId: id })}
      ${B('starts a helper that talks to you', { type: 'childSpawned', parentId: id, audience: 'human' })}
      ${B('starts a helper that works for it', { type: 'childSpawned', parentId: id, audience: 'parent' })}
      ${B('PR checks fail', { type: 'prChecks', threadId: id, result: 'failing' })}
      ${B('PR checks pass', { type: 'prChecks', threadId: id, result: 'passing' })}</div>
      <h2>You…</h2><div class="btns">
      ${B('answer it', { type: 'interactionAnswered', threadId: id })}
      ${B('verify it', { type: 'verified', threadId: id })}
      ${B('mark it seen', { type: 'markedSeen', threadId: id })}</div>`;
  }
  h += `<h2>Other</h2><div class="btns">${B('Start a new agent', { type: 'threadStarted' })}${B('Wait 2 seconds', { type: 'timePassed', ms: 2000 })}<button class="btn" data-reset>Reset</button></div>
    <h2>Rules you can change</h2>${Object.entries(M.SETTING_LABELS).map(([key, def]) => `<div class="seglabel">${esc(def.title)}</div>
      <div class="seg">${Object.entries(def.options).map(([val, l]) => `<button class="${state.settings[key] === val ? 'on' : ''}" data-do='${esc(JSON.stringify({ type: 'settingChanged', key, value: val }))}'>${esc(l)}</button>`).join('')}</div>`).join('')}</div>`;
  const el = document.getElementById('right');
  el.innerHTML = h;
  el.querySelectorAll('[data-do]').forEach(b => b.onclick = () => freeDispatch(JSON.parse(b.dataset.do)));
  el.querySelectorAll('[data-sel]').forEach(b => b.onclick = () => { ui.sel = b.dataset.sel; render(); });
  el.querySelector('[data-reset]').onclick = () => startTab(FREE);
}

// ---------- details, off by default ----------
function threadFacts(t, v) {
  const s = M.ownState(t, state.now, state.settings), f = [];
  f.push(`${plainStatus(t)} <code>status: ${t.status}${s.kind === 'settling' ? ' (in 2 s grace)' : ''}</code>`);
  if (t.hasPendingInteraction) f.push(`<code>hasPendingInteraction: true</code>`);
  if (t.status === 'idle' && t.turnEnd) f.push(`last turn read as a ${t.turnEnd} <code>cheap model</code>`);
  if (t.parentThreadId) { const a = M.audienceOf(t); f.push(`${a.audience === 'human' ? 'talks to you' : 'works for its parent'} (${a.why}) <code>parentThreadId, pluginMetadata.audience</code>`); }
  if (t.commits.length) f.push(`${t.commits.length} change(s), head ${t.commits[t.commits.length - 1].sha} <code>bb--git status</code>`);
  if (t.pr) f.push(`PR #${t.pr.number}, checks ${t.pr.checks} <code>bb--github-pr-status</code>`);
  if (v.ownerOf[t.id] !== t.id) f.push(`shows on “${esc(state.threads[v.ownerOf[t.id]].title)}”`);
  return f.map(x => `<div>${x}</div>`).join('');
}

function renderDetails(v) {
  const el = document.getElementById('details');
  let h = `<button class="link" data-details>${ui.details ? '▾ Hide details' : '▸ Show details: agents, field names, sign-off log'}</button>`;
  if (ui.details) {
    const kids = {}, roots = [];
    for (const t of Object.values(state.threads)) (t.parentThreadId ? (kids[t.parentThreadId] = kids[t.parentThreadId] || []) : roots).push(t);
    const node = t => `<div class="thread"><span class="tt">${esc(t.title)}</span> <span class="mono" style="color:var(--muted)">${t.id}</span><div class="facts">${threadFacts(t, v)}</div>
      ${kids[t.id] ? `<div class="children">${kids[t.id].map(node).join('')}</div>` : ''}</div>`;
    const log = state.verifications.slice().reverse().map(r => {
      const e = r.evidence, bits = [];
      if (e.commits.length) bits.push(e.commits.map(c => c.sha).join(', '));
      if (e.tests) bits.push(`tests ${e.tests.passed} passed (stub: no SDK source for tests)`);
      if (e.pr) bits.push(`PR #${e.pr.number} ${e.pr.checks}`);
      if (e.childSummaries.length) bits.push(`${e.childSummaries.length} helper report(s)`);
      return `<div class="entry"><b>${r.kind === 'verified' ? 'Verified' : 'Marked seen, not verified'}:</b> ${esc(state.threads[r.threadId].title)}
        <div class="m">By ${r.by} at ${fmt(r.at)} (bb gives plugins no user name). Covered: ${esc(bits.join(' · ') || 'nothing')}. Scope: ${esc(r.scope)}.</div></div>`;
    }).join('') || '<div class="m">No sign-offs yet.</div>';
    h += `<div class="dgrid"><div class="panel"><h3>Agents</h3>${roots.map(node).join('')}</div>
      <div class="panel"><h3>Sign-off log</h3>${log}<h3 style="margin-top:14px">Everything that happened</h3><div class="events">${state.log.slice().reverse().map(l =>
        `<div><span class="tm">${fmt(l.at)}</span>${l.refused ? '<b>' : ''}${esc(l.text)}${l.refused ? '</b>' : ''}</div>`).join('')}</div></div></div>`;
  }
  el.innerHTML = h;
  el.querySelector('[data-details]').onclick = () => { ui.details = !ui.details; render(); };
}

function render() {
  document.getElementById('tabs').innerHTML = WALKS.map((w, i) => `<button class="${ui.tab === i ? 'on' : ''}" data-t="${i}">${esc(w.tab)}</button>`).join('')
    + `<button class="free ${ui.tab === FREE ? 'on' : ''}" data-t="${FREE}">Free play</button>`;
  document.querySelectorAll('#tabs [data-t]').forEach(b => b.onclick = () => startTab(+b.dataset.t));
  const onTab = document.querySelector('#tabs .on'), strip = document.getElementById('tabs');
  if (onTab) strip.scrollLeft = onTab.offsetLeft - strip.offsetLeft - 16;
  const v = view(state);
  renderSidebar(v, prevView, ui.tab === FREE);
  if (ui.tab === FREE) renderFree(); else renderStory();
  renderDetails(v);
}
startTab(0);
</script>
</body>
</html>
